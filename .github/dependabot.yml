version: 2
updates:
  - package-ecosystem: gomod
    groups:
      patch:
        group-by: dependency-name
        update-types:
          - "patch"
      update:
        group-by: dependency-name
        update-types:
          - "minor"
    directory: "/"
    ignore:
      - update-types:
          - version-update:semver-major
        dependency-name: '*'
      - update-types:
          - version-update:semver-major
          - version-update:semver-minor
        dependency-name: go
    exclude-paths:
      - "**/vendor/**"
      - "**/tmp/**"
    schedule:
      interval: "weekly"
    vendor: false
    open-pull-requests-limit: 10
